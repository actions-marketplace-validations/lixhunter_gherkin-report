name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag integrity
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git fetch --no-tags origin main
          git fetch --tags origin

          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "Tag ${TAG} must be annotated."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          if [ "${TAG_COMMIT}" != "${MAIN_COMMIT}" ]; then
            echo "Tag ${TAG} must point to HEAD of main."
            echo "tag=${TAG_COMMIT} main=${MAIN_COMMIT}"
            exit 1
          fi

      - name: Build source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --output "dist/gherkin-report-${GITHUB_REF_NAME}.tar.gz" "${GITHUB_SHA}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/gherkin-report-${{ github.ref_name }}.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/gherkin-report-${{ github.ref_name }}.tar.gz



