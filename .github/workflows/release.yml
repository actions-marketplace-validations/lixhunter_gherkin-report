name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Calculate release version from PR labels
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Force-sync tags to avoid "would clobber existing tag" fetch errors.
          git fetch origin "+refs/tags/*:refs/tags/*"

          semver_at_head="$(git tag --points-at HEAD --list 'v*.*.*' | head -n1 || true)"
          if [ -n "${semver_at_head}" ]; then
            echo "Head already tagged as ${semver_at_head}; skipping release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prev_tag="$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || printf 'v0.0.0')"
          echo "Previous tag: ${prev_tag}"

          prs="$(git log --pretty=format:%s "${prev_tag}"..HEAD | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)"
          if [ -z "${prs}" ]; then
            echo "No PR references found in ${prev_tag}..HEAD; skipping release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          has_breaking=false
          has_feature=false
          has_fix=false

          while IFS= read -r pr; do
            [ -n "${pr}" ] || continue
            label="$(gh pr view "${pr}" --json labels --jq '.labels | map(.name) | map(select(. == "breaking-change" or . == "feature" or . == "fix" or . == "ignore-release")) | .[0] // ""')"
            if [ -z "${label}" ]; then
              echo "PR #${pr} has no supported release label; skipping it in release calculation."
              continue
            fi

            case "${label}" in
              breaking-change)
                has_breaking=true
                ;;
              feature)
                has_feature=true
                ;;
              fix)
                has_fix=true
                ;;
              ignore-release)
                ;;
            esac
          done <<< "${prs}"

          if [ "${has_breaking}" = false ] && [ "${has_feature}" = false ] && [ "${has_fix}" = false ]; then
            echo "Only ignore-release (or unsupported) labels found; skipping release."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major="$(echo "${prev_tag#v}" | cut -d. -f1)"
          minor="$(echo "${prev_tag#v}" | cut -d. -f2)"
          patch="$(echo "${prev_tag#v}" | cut -d. -f3)"

          if [ "${has_breaking}" = true ]; then
            new_tag="v$((major + 1)).0.0"
          elif [ "${has_feature}" = true ]; then
            new_tag="v${major}.$((minor + 1)).0"
          else
            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Calculated tag: ${new_tag}"

      - name: Create and push tag
        if: steps.version.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Create GitHub Release
        if: steps.version.outputs.skipped != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes
